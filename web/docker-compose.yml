services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file: .env
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3
volumes:
  data:
